<!DOCTYPE html>
<html lang="en">
<head>

    <script>(function () { var k = 'devbox_theme'; var stored = null; try { stored = localStorage.getItem(k); } catch (e) {} var t = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); document.documentElement.setAttribute('data-theme', t); function updateThemeColor(th) { var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', th === 'light' ? '#F5F7FA' : '#0A0C10'); } function a(th) { document.documentElement.setAttribute('data-theme', th); try { localStorage.setItem(k, th); } catch (e) {} updateThemeColor(th); document.querySelectorAll('.theme-toggle').forEach(function (b) { var i = b.querySelector('.theme-toggle-icon'), l = b.querySelector('.theme-toggle-label'); if (i) i.textContent = th === 'light' ? '🌙' : '☀️'; if (l) l.textContent = th === 'light' ? 'Dark mode' : 'Light mode'; }); } window.toggleTheme = function () { a(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }; window.applyTheme = a; updateThemeColor(t); })();</script>
    <meta name="description" content="DevBox — Quick reference for regular expression syntax">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Cheatsheet — DevBox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"></noscript>
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
    <link rel="apple-touch-icon" href="../assets/icon-192.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0A0C10">
    <meta property="og:title" content="Regex Cheatsheet — DevBox">
    <meta property="og:description" content="Quick reference for regular expression syntax">
    <meta property="og:type" content="website">
    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "TechArticle",
    "headline": "Regex Cheatsheet",
    "description": "Quick reference for regular expression syntax",
    "url": "https://devmina.github.io/devbox/cheatsheets/regex-cheatsheet.html",
    "isPartOf": {
        "@type": "WebSite",
        "name": "DevBox",
        "url": "https://devmina.github.io/devbox/"
    }
}
    </script>
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content-wrap">
            <div class="content" style="min-width:0">
                <div class="tool-header">
                    <div class="tool-icon" style="background:var(--blue-dim);color:var(--blue)">/^$/</div>
                    <div>
                        <div class="tool-title">Regex Cheatsheet</div>
                        <div class="tool-desc">Quick reference for regular expression syntax</div>
                    </div>
                </div>

                <div class="panel" style="margin-bottom:14px">
                    <div class="panel-bar"><span class="panel-label">Search</span>
                        <div class="panel-actions"><button class="share-btn" onclick="saveToURL({q:'csSearch'});navigator.clipboard.writeText(location.href).then(()=>showToast('🔗 Link copied!'))">⎘ Share</button></div>
                    </div>
                    <div class="input-row" style="border-bottom:none">
                        <input type="text" id="csSearch" placeholder="Search syntax… e.g. lookahead, quantifier, anchor" oninput="renderCS()">
                    </div>
                </div>
                <div class="panel" style="margin-bottom:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
                    <span style="font-size:0.8rem;color:var(--text-dim)">Want to test a pattern live?</span>
                    <a href="../tools/regex.html" class="btn btn-ghost" style="text-decoration:none">Open Regex Tester →</a>
                </div>
                <div id="csList"></div>
            </div>
            <footer class="site-footer">
                © 2026 Mina Abdo. All rights reserved.
            </footer>

        </main><!-- /content-wrap -->
    </div>
    <div class="toast" id="toast"></div>
    <script src="../assets/shared.js" defer></script>
    <script src="../assets/sidebar.js" defer></script>
    <script>
        const CS_ENTRIES = [["^", "Start of string (or line, with /m flag)", "Anchors"], ["$", "End of string (or line, with /m flag)", "Anchors"], ["\\b", "Word boundary", "Anchors"], ["\\B", "Not a word boundary", "Anchors"], [".", "Any character except newline", "Character Classes"], ["\\d", "Digit (0-9)", "Character Classes"], ["\\D", "Not a digit", "Character Classes"], ["\\w", "Word character (a-z, A-Z, 0-9, _)", "Character Classes"], ["\\W", "Not a word character", "Character Classes"], ["\\s", "Whitespace (space, tab, newline)", "Character Classes"], ["\\S", "Not whitespace", "Character Classes"], ["[abc]", "Any of a, b, or c", "Character Classes"], ["[^abc]", "Not a, b, or c", "Character Classes"], ["[a-z]", "Any lowercase letter a through z", "Character Classes"], ["*", "0 or more of the preceding token", "Quantifiers"], ["+", "1 or more of the preceding token", "Quantifiers"], ["?", "0 or 1 of the preceding token (optional)", "Quantifiers"], ["{n}", "Exactly n times", "Quantifiers"], ["{n,}", "n or more times", "Quantifiers"], ["{n,m}", "Between n and m times", "Quantifiers"], ["*?  +?  ??", "Lazy (non-greedy) versions of the above", "Quantifiers"], ["(...)", "Capturing group", "Groups"], ["(?:...)", "Non-capturing group", "Groups"], ["(?<name>...)", "Named capturing group", "Groups"], ["|", "Alternation (OR)", "Groups"], ["\\1", "Backreference to capture group 1", "Groups"], ["(?=...)", "Positive lookahead", "Lookarounds"], ["(?!...)", "Negative lookahead", "Lookarounds"], ["(?<=...)", "Positive lookbehind", "Lookarounds"], ["(?<!...)", "Negative lookbehind", "Lookarounds"], ["g", "Global \u2014 find all matches, not just the first", "Flags"], ["i", "Case-insensitive matching", "Flags"], ["m", "Multiline \u2014 ^ and $ match line boundaries", "Flags"], ["s", "Dotall \u2014 . also matches newline", "Flags"], ["u", "Unicode mode", "Flags"], ["\\n \\t \\r", "Newline, tab, carriage return", "Escapes"], ["\\.", "Literal dot (escape special characters with \\\\)", "Escapes"]];
        const CS_COLORS = {"Anchors": "var(--blue)", "Character Classes": "var(--green)", "Quantifiers": "var(--yellow)", "Groups": "var(--purple)", "Lookarounds": "var(--orange)", "Flags": "var(--cyan)", "Escapes": "var(--red)"};
        function renderCS() {
            const q = document.getElementById('csSearch').value.toLowerCase();
            const filtered = q ? CS_ENTRIES.filter(([cmd, desc, group]) => cmd.toLowerCase().includes(q) || desc.toLowerCase().includes(q) || group.toLowerCase().includes(q)) : CS_ENTRIES;
            const byGroup = {};
            filtered.forEach(e => { if (!byGroup[e[2]]) byGroup[e[2]] = []; byGroup[e[2]].push(e); });
            let html = '';
            Object.keys(byGroup).forEach(group => {
                const color = CS_COLORS[group] || 'var(--text-dim)';
                html += `<div style="margin-bottom:14px"><div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:${color};padding:8px 0 6px">${group}</div><div class="panel" style="margin:0"><div class="hash-grid">`;
                byGroup[group].forEach(([cmd, desc]) => {
                    html += `<div class="hash-row"><div style="font-family:var(--mono);font-weight:600;font-size:0.85rem;color:var(--text-bright);min-width:170px;flex-shrink:0;word-break:break-word">${cmd.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div><div style="flex:1;min-width:0;font-size:0.78rem;color:var(--text-dim);line-height:1.4">${desc}</div><button class="uuid-copy" onclick="copy('${cmd.replace(/`/g, '\\`').replace(/'/g,"\\'")}')">⎘</button></div>`;
                });
                html += '</div></div></div>';
            });
            document.getElementById('csList').innerHTML = html || '<div style="padding:20px;color:var(--text-dim);text-align:center">No results found.</div>';
        }
        function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
        document.addEventListener('DOMContentLoaded', () => loadFromURL({q:'csSearch'}, renderCS) || renderCS());
    </script>
</body>
</html>
