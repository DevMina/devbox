<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog — DevBox</title>
    <meta name="description" content="DevBox — Recent updates, new tools, and fixes">
    <link rel="alternate" type="application/rss+xml" title="DevBox Changelog" href="changelog.xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"></noscript>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">

    <meta property="og:title" content="Changelog — DevBox">
    <meta property="og:description" content="Recent updates, new tools, and fixes">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://devmina.github.io/devbox/assets/og/og-default.png">
    <link rel="canonical" href="https://devmina.github.io/devbox/changelog.html">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
        <main class="content-wrap">
            <div class="content" style="min-width:0;max-width:760px">
                <div class="tool-header">
                    <div class="tool-icon" style="background:var(--green-dim);color:var(--green)">✓</div>
                    <div>
                        <div class="tool-title">Changelog</div>
                        <div class="tool-desc">What's new in DevBox — <a href="changelog.xml" style="color:var(--text-dim)">RSS feed</a></div>
                    </div>
                </div>

                <div id="changelogList"></div>
            </div>
            <footer class="site-footer">
                © 2026 Mina Abdo. All rights reserved. &nbsp;·&nbsp;
                <a href="contact.html" style="color:var(--text-dim);text-decoration:none;transition:color 0.15s" onmouseover="this.style.color='var(--green)'" onmouseout="this.style.color='var(--text-dim)'">Contact</a> &nbsp;·&nbsp;
                <a href="about.html" style="color:var(--text-dim);text-decoration:none;transition:color 0.15s" onmouseover="this.style.color='var(--green)'" onmouseout="this.style.color='var(--text-dim)'">About</a> &nbsp;·&nbsp;
                <a href="https://github.com/devmina/devbox" target="_blank" rel="noopener noreferrer" style="color:var(--text-dim);text-decoration:none;transition:color 0.15s" onmouseover="this.style.color='var(--green)'" onmouseout="this.style.color='var(--text-dim)'">GitHub ↗</a>
            </footer>
        </main><!-- /content-wrap -->
    </div>
    <div class="toast" id="toast"></div>
    <script src="assets/shared.js" defer></script>
    <script src="assets/sidebar.js" defer></script>
    <script>
        // Keep this in sync with changelog.xml — both are generated from the
        // same list of entries so the page and the RSS feed never drift apart.
        const CHANGELOG = [
            {
                date: "2026-08-11",
                title: "Privacy messaging, category filters, command palette actions, input persistence, Send To expansion, and Most Used",
                items: [
                    "Strengthened the hero with an explicit privacy value proposition: '78 developer tools that run entirely in your browser — fast, private, and free.' Added a green 🔒 client-side badge to the hero and to tool cards for JWT Decoder, JWT Encoder, Text Encrypt, .env Parser, and API Tester.",
                    "Added privacy banners inside the JWT Decoder, JWT Encoder, Text Encrypt, .env Parser, and API Tester tool pages — each worded specifically to the risk (e.g. 'Your API keys stay in your browser — requests go directly from your browser to the target server').",
                    "Added category filter tabs (Format, Inspect, Encode, Security, Generate, Color, CSS, API, Convert, Text, Productivity, Cheatsheets) above the search bar for faster navigation without typing.",
                    "Added a collapsible What's New strip showing the 5 most recently added tools, with a Full changelog link.",
                    "Added an extension promo strip at the bottom of the homepage.",
                    "Upgraded the ⌘K command palette with an Actions group at the top: Toggle Dark/Light Mode, Clear Recent History, Clear All Favorites, Open Settings & Data. Results now render with labeled section dividers (Actions → Pages → Format → Inspect …).",
                    "Added input persistence to 19 tools — last input is saved to localStorage and restored on next visit, but only when there's no URL share param or handoff active. Covered: JSON Formatter, Regex Tester (pattern + test string), SQL Formatter, Diff Checker (both sides), HTML Beautifier, CSS Minifier, Base64, Markdown Preview, Case Converter, Line Sorter, Text Stats, Hash Generator, Morse Code, XML Formatter, TOML↔JSON, String Escape, HTML Entities, Unicode Converter. Sensitive tools (JWT, .env, Text Encrypt, API keys) are explicitly excluded from persistence. A 100KB per-key size guard prevents filling the storage quota.",
                    "Expanded Send To tool chaining to 11 previously missing tools: Regex Tester, SQL Formatter, Diff Checker, HTML Beautifier, CSS Minifier, Markdown Preview, Case Converter, Line Sorter, XML Formatter, TOML↔JSON, HTML Entities, Unicode Converter.",
                    "Added a 🔥 Most Used section to the homepage — tracks visit counts silently, appears once you've used tools, and has its own Clear button. Integrated into Settings panel and Reset All Data.",
                    "Enriched search aliases (data-tags) across 10 tools: added 'regexp/regular expression/lookahead' for Regex, 'bearer/hs256' for JWT, 'atob/btoa/binary' for Base64, 'postman/insomnia/patch' for API Tester, 'nanoid/ulid' for UUID, 'sha512/hmac/crypto' for Hash, 'iso8601/utc/timezone/now' for Date & Time, 'colour/hwb/lch' for Color Converter."
                ]
            },
            {
                date: "2026-07-06",
                title: "Extension distribution, and a caching bug fixed for good",
                items: [
                    "Added a new Extension page with a direct download link and step-by-step install instructions, linked from the sidebar and homepage.",
                    "Fixed a service worker bug where updated CSS/JS wouldn't reach returning visitors after a deploy — the cache version is now bumped automatically on every push via CI, so nobody needs to clear their cache again.",
                    "Fixed a sidebar layout bug where the Changelog/Extension/Contact shortcut links would clip or overlap once a new one was added."
                ]
            },
            {
                date: "2026-07-06",
                title: "Cheatsheet downloads, social previews, tool chaining, and a browser extension",
                items: [
                    "Added Print and Markdown download buttons to all 4 cheatsheets, with print styles that stay readable regardless of your current theme.",
                    "Generated a branded preview image for each of the 14 tool categories and wired the correct one into every tool page, so shared links now show a proper preview instead of a generic one.",
                    "Added tool chaining (\"Send to →\") so a tool's output can become another tool's input in one click — wired across the JSON/data-format family (JSON Formatter, JSON Schema, JSON Path, JSON↔CSV, YAML, XML) and the encoding family (Base64, URL, JWT into JSON Formatter).",
                    "Added a browser extension (Chrome, Edge, Brave) with a toolbar popup for quick access to 10 common tools, plus right-click actions on any selected text — Format as JSON, Base64 Decode, URL Decode, Decode JWT, and Hash — that open the matching tool with your selection already filled in."
                ]
            },
            {
                date: "2026-07-05",
                title: "Cheatsheets, embeddable tools, and an automated test suite",
                items: [
                    "Added a Cheatsheets section: Regex, Git, Bash & Linux, and Docker quick references, searchable and cross-linked with related tools.",
                    "Added an Embed Generator — any tool or cheatsheet can now be dropped into another site or wiki via a copy-paste &lt;iframe&gt; snippet.",
                    "Added structured data (JSON-LD) to every tool and cheatsheet page for richer search engine results.",
                    "Added an automated regression test suite covering every real bug class this project has hit, wired into CI so it runs on every push."
                ]
            },
            {
                date: "2026-07-04",
                title: "SEO foundations",
                items: [
                    "Added a sitemap.xml covering every page and a robots.txt pointing to it.",
                    "Verified the site behaves correctly when deployed under a subpath (e.g. a GitHub Pages project site) rather than a domain root."
                ]
            },
            {
                date: "2026-07-02",
                title: "PWA support restored, safely",
                items: [
                    "Brought back service-worker-backed installability (\"Add to Home Screen\") without reintroducing stale cached pages — HTML is now always fetched fresh when online, with the cache used only as an offline fallback."
                ]
            },
            {
                date: "2026-07-01",
                title: "Cross-browser fixes",
                items: [
                    "Fixed click-to-upload silently failing in some browsers (the hidden file input wasn't being attached to the page before being triggered).",
                    "Fixed the share button's style to match the rest of the site's buttons.",
                    "Removed an unnecessary service worker that was causing edited pages to keep showing stale content."
                ]
            },
            {
                date: "2026-06-30",
                title: "Stability pass",
                items: [
                    "Fixed the Regex Tester freezing the tab on catastrophic-backtracking patterns.",
                    "Fixed the Diff Checker hanging on very long single lines (e.g. minified code).",
                    "Fixed pages breaking entirely when localStorage is blocked (private browsing, strict cookie policies).",
                    "Reorganized the tool sidebar into clearer categories."
                ]
            }
        ];

        function renderChangelog() {
            const el = document.getElementById('changelogList');
            el.innerHTML = CHANGELOG.map(entry => `
                <div class="panel" style="margin-bottom:16px">
                    <div style="padding:16px 18px 4px">
                        <div style="font-family:var(--mono);font-size:0.72rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em">${entry.date}</div>
                        <div style="font-size:1rem;font-weight:700;color:var(--text-bright);margin-top:4px">${entry.title}</div>
                    </div>
                    <ul style="margin:0;padding:10px 18px 16px 34px;font-size:0.85rem;color:var(--text-dim);line-height:1.7">
                        ${entry.items.map(i => `<li>${i}</li>`).join('')}
                    </ul>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderChangelog);
    </script>
</body>
</html>
