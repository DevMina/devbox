name: Regression suite

# Runs the Playwright-based regression suite (tests/regression_suite.py)
# against a local static server on every push and pull request to master.
# Purely additive -- doesn't touch or replace the GitHub Pages deploy
# mechanism (Settings -> Pages, "Deploy from a branch").

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  regression-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fast, no-browser-needed checks first -- these fail in seconds, so
      # there's no point spending time installing Playwright/Chromium if
      # something obvious is already broken.

      - name: Security pattern scan
        run: python3 tests/security_scan.py

      - name: Internal link check
        run: python3 tests/check_links.py

      - name: Sidebar/navigation completeness check
        run: python3 tests/check_nav.py

      - name: SEO metadata completeness check (og:image, JSON-LD)
        run: python3 tests/check_seo.py

      - name: Sitemap completeness check
        run: python3 tests/check_sitemap.py

      - name: Install Playwright
        run: |
          pip install playwright --break-system-packages
          playwright install --with-deps chromium

      - name: Install axe-core
        run: npm install axe-core

      - name: Start local server
        run: python3 -m http.server 8000 &

      - name: Wait for server
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/index.html > /dev/null && break
            sleep 1
          done

      - name: Accessibility check (axe-core)
        # Non-blocking for now: a real backlog of ~122 pre-existing issues
        # (mostly missing form labels on individual tools) was found when
        # this was added on 2026-07-07. One shared CSS bug affecting every
        # page was found and fixed as part of adding this check, but the
        # rest are genuine per-tool issues, not a single fix. Flip
        # continue-on-error to false once that backlog is cleared.
        continue-on-error: true
        run: python3 tests/check_accessibility.py

      - name: Run regression suite
        run: python3 tests/regression_suite.py http://localhost:8000
